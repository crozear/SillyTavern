<div class="vw-dialog">
    <h3><i class="fa-solid fa-film"></i> Watch a video</h3>

    <label for="vw_dlg_source">Video URL or server path</label>
    <input id="vw_dlg_source" class="text_pole" type="text" placeholder="https://youtu.be/…  or  C:\path\to\clip.mp4" value="{{source}}">

    <div class="flex-container flexGap5 alignItemsCenter marginTop5">
        <label for="vw_dlg_file" class="menu_button"><i class="fa-solid fa-file-video"></i> Pick a local file…</label>
        <input id="vw_dlg_file" type="file" accept="video/*" hidden>
        <span id="vw_dlg_file_name" class="opacity50p"></span>
    </div>

    <label for="vw_dlg_question" class="marginTop5">Question (optional)</label>
    <textarea id="vw_dlg_question" class="text_pole" rows="2" placeholder="What happens at the 30 second mark?"></textarea>

    <div class="vw-grid marginTop5">
        <div>
            <label for="vw_dlg_detail">Detail</label>
            <select id="vw_dlg_detail" class="text_pole">
                <option value="transcript">transcript</option>
                <option value="efficient">efficient</option>
                <option value="balanced">balanced</option>
                <option value="token-burner">token-burner</option>
            </select>
        </div>
        <div>
            <label for="vw_dlg_whisper">Whisper</label>
            <select id="vw_dlg_whisper" class="text_pole">
                <option value="auto">auto</option>
                <option value="groq">Groq</option>
                <option value="openai">OpenAI</option>
                <option value="none">disabled</option>
            </select>
        </div>
        <div>
            <label for="vw_dlg_start">Start (SS / MM:SS)</label>
            <input id="vw_dlg_start" class="text_pole" type="text" placeholder="e.g. 1:30">
        </div>
        <div>
            <label for="vw_dlg_end">End (SS / MM:SS)</label>
            <input id="vw_dlg_end" class="text_pole" type="text" placeholder="e.g. 2:00">
        </div>
        <div>
            <label for="vw_dlg_maxframes">Max frames</label>
            <input id="vw_dlg_maxframes" class="text_pole" type="number" min="1" step="1" placeholder="detail cap" value="{{maxFrames}}">
        </div>
        <div>
            <label for="vw_dlg_resolution">Frame width (px)</label>
            <input id="vw_dlg_resolution" class="text_pole" type="number" min="128" max="2048" step="1" value="{{resolution}}">
        </div>
        <div>
            <label for="vw_dlg_fps">FPS override (≤2)</label>
            <input id="vw_dlg_fps" class="text_pole" type="number" min="0.1" max="2" step="0.1" placeholder="auto" value="{{fps}}">
        </div>
        <div>
            <label for="vw_dlg_timestamps">Cue timestamps</label>
            <input id="vw_dlg_timestamps" class="text_pole" type="text" placeholder="4:32,7:10">
        </div>
    </div>

    <label class="checkbox_label marginTop5" for="vw_dlg_nodedup">
        <input id="vw_dlg_nodedup" type="checkbox">
        <span>Keep near-duplicate frames</span>
    </label>
</div>
